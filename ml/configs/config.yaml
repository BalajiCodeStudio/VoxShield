model:
  name: "RawTFNet"
  repository: "SpeechAntiSpoofingBenchmarks/RawTFNet"
  checkpoint_path: "ml/models/lightweight/rawtfnet/Best_RawTFNet_32.pth"
  onnx_path: "ml/models/lightweight/rawtfnet/rawtfnet.onnx"
  use_onnx: false
  device: "cpu"

audio:
  sample_rate: 16000
  window_seconds: 4.0375
  hop_seconds: 2.0
  target_length_samples: 64600

inference:
  threshold: 0.50
  uncertain_margin: 0.05
  min_speech_duration: 0.30

vad:
  enabled: true
  mode: "silero"
  energy_threshold: 0.005

smoothing:
  method: "ema"
  alpha: 0.4
  window_size: 5
